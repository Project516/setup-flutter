name: Move major tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Move major tag to latest release
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            MAJOR="${TAG%.*.*}"
            git tag -f "$MAJOR" "$TAG"
            git push origin "$MAJOR" --force
          fi
