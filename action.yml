name: Setup Flutter with pub cache
description: Install Flutter, restore the pub cache keyed on pubspec.yaml, and run flutter pub get, as a single step.
branding:
  icon: download
  color: blue

inputs:
  flutter-version:
    description: Exact Flutter version to install. Leave empty to track a channel instead.
    required: false
    default: ''
  channel:
    description: Flutter channel to track when no exact version is given.
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: true
        cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

    - name: Cache pub
      uses: actions/cache@v6
      with:
        # subosito/flutter-action@v2 exports PUB_CACHE to the job environment,
        # pointing at the directory `flutter pub get` actually populates
        # (~/.pub-cache on Linux and macOS, the LOCALAPPDATA Pub Cache on
        # Windows). Cache that path directly so this step stays in sync with
        # the SDK install step on every runner OS. Hardcoding ~/.pub-cache
        # instead misses the real cache directory on Windows runners, where
        # Flutter writes pub packages to %LOCALAPPDATA%\Pub\Cache by default.
        path: ${{ env.PUB_CACHE }}
        key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Fetch packages
      run: flutter pub get
      shell: bash
